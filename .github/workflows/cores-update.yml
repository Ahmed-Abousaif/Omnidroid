name: Scheduled Emulation Cores & DB Update

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      cores:
        description: 'Comma-separated core names to update (empty for all)'
        required: false
        default: ''
      abis:
        description: 'Comma-separated ABIs (empty for all 4 ABIs)'
        required: false
        default: ''
      eden_ref:
        description: 'Eden source branch, tag, or SHA (master follows the latest commit)'
        required: false
        default: 'master'
      cemu_tag:
        description: 'Cemu core GitHub release tag'
        required: false
        default: 'v0.1.0'
      skip_buildbot:
        description: 'Skip downloading cores from Libretro buildbot'
        required: false
        type: boolean
        default: false
      create_pr:
        description: 'Create an update PR when publishing access is configured (results are always uploaded)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cores-database-update
  cancel-in-progress: false

jobs:
  update-cores:
    name: Sync Cores & Database Slices
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH_CORES: ${{ secrets.CORES_UPDATE_DEPLOY_KEY != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Resolve Cores Submodule Commit
        id: cores_ref
        run: |
          echo "sha=$(git rev-parse HEAD:omnidroid-cores)" >> "$GITHUB_OUTPUT"
          git submodule init -- omnidroid-cores

      - name: Checkout Cores
        uses: actions/checkout@v4
        with:
          repository: Ahmed-Abousaif/OmnidroidCores
          ref: ${{ steps.cores_ref.outputs.sha }}
          path: omnidroid-cores
          # A repository-scoped deploy key lets this job publish the submodule
          # commit without granting access to private standalone source repos.
          ssh-key: ${{ secrets.CORES_UPDATE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Checkout CHD Dependency
        run: git submodule update --init -- omnidroid-chd/src/main/cpp/libchdr

      - name: Checkout Eden Source
        if: inputs.cores == '' || contains(inputs.cores, 'switch')
        run: git submodule update --init -- modules/switch/upstream/eden

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Resolve Eden Source Commit
        if: inputs.cores == '' || contains(inputs.cores, 'switch')
        env:
          EDEN_REF: ${{ inputs.eden_ref || 'master' }}
        run: python omnidroid-cores/build_eden.py --update-only --ref "$EDEN_REF"

      - name: Test Core Updater
        run: python -m unittest discover -s omnidroid-cores -p 'test_*.py'

      - name: Set up Eden Native Build
        if: inputs.cores == '' || contains(inputs.cores, 'switch')
        uses: ./.github/actions/setup-eden

      - name: Run Omnidroid Core Updater
        env:
          CORES: ${{ inputs.cores }}
          ABIS: ${{ inputs.abis }}
          CEMU_TAG: ${{ inputs.cemu_tag }}
          SKIP_BUILDBOT: ${{ inputs.skip_buildbot }}
        run: |
          ARGS=(--jobs 8 --eden-ref pinned --eden-jobs 2)
          if [ -n "$CORES" ]; then
            ARGS+=(--cores "$CORES")
          fi
          if [ -n "$ABIS" ]; then
            ARGS+=(--abis "$ABIS")
          fi
          if [ -n "$CEMU_TAG" ]; then
            ARGS+=(--cemu-tag "$CEMU_TAG")
          fi
          if [ "$SKIP_BUILDBOT" = "true" ]; then
            ARGS+=(--skip-buildbot)
          fi
          python omnidroid-cores/update_cores.py "${ARGS[@]}"

      - name: Upload Built Eden Libraries
        if: inputs.cores == '' || contains(inputs.cores, 'switch')
        uses: actions/upload-artifact@v4
        with:
          name: eden-native
          path: |
            omnidroid-cores/omnidroid_core_switch/src/main/jniLibs/arm64-v8a/*.so
            omnidroid-cores/omnidroid_core_switch/src/main/sdl/
            omnidroid-cores/omnidroid_core_switch/src/main/eden-build.json

      - name: Verify Core Health & ABI Consistency
        run: |
          python omnidroid-cores/update_cores.py --verify

      - name: Sync Libretro Database Slices
        run: |
          chmod +x gradlew
          ./gradlew :libretro-db-builder:run --no-daemon

      - name: Validate Dynamic Feature Compilation
        run: |
          ./gradlew :omnidroid-app:compilePlayDynamicDebugKotlin --no-daemon

      - name: Commit Cores Submodule Updates
        id: cores_commit
        working-directory: omnidroid-cores
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(cores): refresh selected cores and database slices'
            git bundle create "$RUNNER_TEMP/cores-update.bundle" HEAD ^${{ steps.cores_ref.outputs.sha }}
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Export Update Results
        run: |
          git diff --binary --full-index --ignore-submodules=all HEAD > "$RUNNER_TEMP/database-update.patch"
          git -C omnidroid-cores rev-parse HEAD > "$RUNNER_TEMP/cores-commit.txt"

      - name: Upload Update Results
        uses: actions/upload-artifact@v4
        with:
          name: cores-database-update
          path: |
            ${{ runner.temp }}/cores-update.bundle
            ${{ runner.temp }}/database-update.patch
            ${{ runner.temp }}/cores-commit.txt

      - name: Publish Cores Submodule Commit
        if: steps.cores_commit.outputs.changed == 'true' && env.CAN_PUBLISH_CORES == 'true' && (github.event_name == 'schedule' || inputs.create_pr == true)
        working-directory: omnidroid-cores
        run: git push origin HEAD:refs/heads/automation/cores-sync-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check for Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in workspace:"
            git status --short
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected; all cores and databases are up to date."
          fi

      - name: Create Pull Request
        if: steps.git_status.outputs.has_changes == 'true' && env.CAN_PUBLISH_CORES == 'true' && (github.event_name == 'schedule' || inputs.create_pr == true)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          commit-message: "chore(cores): update libretro & standalone cores and database slices"
          branch: "automation/cores-weekly-sync"
          delete-branch: true
          title: "chore(cores): automated update of emulation cores & database slices"
          body: |
            ## Automated Weekly Cores & Database Sync 🤖

            This PR was automatically generated by the [Scheduled Emulation Cores & DB Update](https://github.com/${{ github.repository }}/actions/workflows/cores-update.yml) workflow.

            ### Summary of Updates:
            - **Libretro Cores**: Refreshed from nightly Libretro buildbot.
            - **Core Selection**: `${{ inputs.cores || 'all registered cores' }}`. Cemu and Eden are updated only when selected.
            - **Multi-ABI Compatibility**: Verified 0-byte dummy fallback `.so` libraries for Google Play App Bundle compliance.
            - **Database Slices**: Re-generated with `:libretro-db-builder:run`.
            - **Build Verification**: Verified `:omnidroid-app:compilePlayDynamicDebugKotlin` succeeds.
          labels: |
            automated-pr
            dependencies
            cores

      - name: Summary
        env:
          HAS_CHANGES: ${{ steps.git_status.outputs.has_changes }}
          CREATE_PR: ${{ github.event_name == 'schedule' || inputs.create_pr == true }}
        run: |
          if [ "$HAS_CHANGES" = "true" ]; then
            echo "### Core Updates Detected 🚀" >> $GITHUB_STEP_SUMMARY
            echo "Updated core commits and database changes are in the cores-database-update artifact." >> "$GITHUB_STEP_SUMMARY"
            if [ "$CAN_PUBLISH_CORES" = "true" ] && [ "$CREATE_PR" = "true" ]; then
              echo "An update pull request was created or refreshed." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Automatic publication was skipped. Import the Git bundle and database patch to review and publish these results." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "### All Cores & Databases are Up to Date ✅" >> $GITHUB_STEP_SUMMARY
            echo "No changes found across registered cores and slices." >> $GITHUB_STEP_SUMMARY
          fi

