name: Scheduled Emulation Cores & DB Update

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      cores:
        description: 'Comma-separated core names to update (empty for all)'
        required: false
        default: ''
      abis:
        description: 'Comma-separated ABIs (empty for all 4 ABIs)'
        required: false
        default: ''
      eden_version:
        description: 'Eden Switch core release version'
        required: false
        default: '0.2.1'
      cemu_tag:
        description: 'Cemu core GitHub release tag'
        required: false
        default: 'v0.1.0'
      skip_buildbot:
        description: 'Skip downloading cores from Libretro buildbot'
        required: false
        type: boolean
        default: false
      create_pr:
        description: 'Create a pull request if changes are detected'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-cores:
    name: Sync Cores & Database Slices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run Omnidroid Core Updater
        run: |
          ARGS="--jobs 8"
          if [ -n "${{ inputs.cores }}" ]; then
            ARGS="$ARGS --cores ${{ inputs.cores }}"
          fi
          if [ -n "${{ inputs.abis }}" ]; then
            ARGS="$ARGS --abis ${{ inputs.abis }}"
          fi
          if [ -n "${{ inputs.eden_version }}" ]; then
            ARGS="$ARGS --eden-version ${{ inputs.eden_version }}"
          fi
          if [ -n "${{ inputs.cemu_tag }}" ]; then
            ARGS="$ARGS --cemu-tag ${{ inputs.cemu_tag }}"
          fi
          if [ "${{ inputs.skip_buildbot }}" = "true" ]; then
            ARGS="$ARGS --skip-buildbot"
          fi
          echo "Running: python omnidroid-cores/update_cores.py $ARGS"
          python omnidroid-cores/update_cores.py $ARGS

      - name: Verify Core Health & ABI Consistency
        run: |
          python omnidroid-cores/update_cores.py --verify

      - name: Sync Libretro Database Slices
        run: |
          chmod +x gradlew
          ./gradlew :libretro-db-builder:run --no-daemon

      - name: Validate Dynamic Feature Compilation
        run: |
          ./gradlew :omnidroid-app:compilePlayDynamicDebugKotlin --no-daemon

      - name: Check for Changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in workspace:"
            git status --short
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected; all cores and databases are up to date."
          fi

      - name: Create Pull Request
        if: steps.git_status.outputs.has_changes == 'true' && (github.event_name == 'schedule' || inputs.create_pr == true)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(cores): update libretro & standalone cores and database slices"
          branch: "automation/cores-weekly-sync"
          delete-branch: true
          title: "chore(cores): automated update of emulation cores & database slices"
          body: |
            ## Automated Weekly Cores & Database Sync 🤖

            This PR was automatically generated by the [Scheduled Emulation Cores & DB Update](https://github.com/${{ github.repository }}/actions/workflows/cores-update.yml) workflow.

            ### Summary of Updates:
            - **Libretro Cores**: Refreshed from nightly Libretro buildbot.
            - **Switch Core (Eden)**: Synced from Eden release APK.
            - **Wii U Core (Cemu)**: Synced from `Ahmed-Abousaif/cemu-libretro-android` releases.
            - **Multi-ABI Compatibility**: Verified 0-byte dummy fallback `.so` libraries for Google Play App Bundle compliance.
            - **Database Slices**: Re-generated with `:libretro-db-builder:run`.
            - **Build Verification**: Verified `:omnidroid-app:compilePlayDynamicDebugKotlin` succeeds.
          labels: |
            automated-pr
            dependencies
            cores

      - name: Summary
        run: |
          if [ "${{ steps.git_status.outputs.has_changes }}" = "true" ]; then
            echo "### Core Updates Detected 🚀" >> $GITHUB_STEP_SUMMARY
            echo "Emulation cores or database slices were updated. Pull request created." >> $GITHUB_STEP_SUMMARY
          else
            echo "### All Cores & Databases are Up to Date ✅" >> $GITHUB_STEP_SUMMARY
            echo "No changes found across registered cores and slices." >> $GITHUB_STEP_SUMMARY
          fi

