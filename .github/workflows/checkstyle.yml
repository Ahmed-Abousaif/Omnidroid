name: Checkstyle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Set up Eden Native Build
      uses: ./.github/actions/setup-eden
    - name: Test Core Updater
      run: python3 -m unittest discover -s omnidroid-cores -p 'test_*.py'
    - name: Build Pinned Eden Libraries
      run: python3 omnidroid-cores/update_cores.py --cores switch --eden-ref pinned --eden-jobs 2
    - name: Run ktlint tests
      run: ./gradlew assembleDebug ktlintCheck
