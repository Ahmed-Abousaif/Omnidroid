name: Checkstyle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Initialize build dependencies
      # Frontend source checks need these pins, not the Eden/Cemu source trees.
      run: |
        git submodule update --init --recursive -- \
          omnidroid-cores \
          omni-libretrodroid \
          omnidroid-chd/src/main/cpp/libchdr \
          modules/padkit/upstream/omnidroid-padkit

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install Android SDK packages
      run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

    - name: Test Core Updater
      run: python3 -m unittest discover -s omnidroid-cores -p 'test_*.py'

    - name: Check Kotlin formatting
      run: ./gradlew ktlintCheck --no-daemon

    - name: Compile app sources
      # One complete frontend variant checks Kotlin/resources without rebuilding native
      # engines or packaging every debug APK. Full builds run in release/update workflows.
      run: ./gradlew :omnidroid-app:compileFreeDynamicDebugKotlin --no-daemon
