name: PadKit input regression tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  input-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize pinned PadKit
        run: git submodule update --init --recursive -- modules/padkit/upstream/omnidroid-padkit
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test input engine, Compose lifecycle, and host mappings
        run: |
          chmod +x gradlew
          ./gradlew :omnidroid-padkit:verifyAndroid7Compatibility :omnidroid-touchinput:testDebugUnitTest --no-daemon
