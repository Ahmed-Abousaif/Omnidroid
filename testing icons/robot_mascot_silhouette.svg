<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024" fill="none">
  <defs>
    <!-- Head cutouts: D-Pad (+) on Left Eye, 4 Buttons (Diamond) on Right Eye, Pill Mouth -->
    <mask id="robot-head-mask">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <!-- Left Eye: D-Pad / Plus Sign (+) -->
      <rect x="138" y="188" width="88" height="30" rx="8" fill="#000000"/>
      <rect x="167" y="159" width="30" height="88" rx="8" fill="#000000"/>
      
      <!-- Right Eye: 4 Action Buttons in Diamond (ABXY layout) -->
      <circle cx="330" cy="168" r="16" fill="#000000"/>
      <circle cx="330" cy="238" r="16" fill="#000000"/>
      <circle cx="295" cy="203" r="16" fill="#000000"/>
      <circle cx="365" cy="203" r="16" fill="#000000"/>

      <!-- Mouth -->
      <rect x="202" y="277" width="108" height="34" rx="17" fill="#000000"/>
    </mask>

    <!-- Chest cutouts -->
    <mask id="robot-body-mask">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <rect x="213" y="426" width="86" height="26" rx="13" fill="#000000"/>
    </mask>
  </defs>

  <!-- Antenna Ball & Stalk -->
  <circle cx="256" cy="26" r="28" fill="#FFFFFF"/>
  <rect x="239" y="49" width="34" height="47" rx="3" fill="#FFFFFF"/>

  <!-- Headphones / Ear Bolts -->
  <path fill="#FFFFFF" d="M64 181 H85 V267 H64 A21 21 0 0 1 43 246 V202 A21 21 0 0 1 64 181 Z"/>
  <path fill="#FFFFFF" d="M427 181 H448 A21 21 0 0 1 469 202 V246 A21 21 0 0 1 448 267 H427 Z"/>

  <!-- Head with D-Pad & 4-Button Eyes -->
  <rect x="85" y="96" width="342" height="256" rx="54" fill="#FFFFFF" mask="url(#robot-head-mask)"/>

  <!-- Neck -->
  <rect x="224" y="352" width="64" height="32" rx="3" fill="#FFFFFF"/>

  <!-- Shoulders & Body with Chest Vent -->
  <path fill="#FFFFFF" d="M139 384 H373 C402 384 427 409 427 437 V501 H85 V437 C85 409 110 384 139 384 Z" mask="url(#robot-body-mask)"/>
</svg>